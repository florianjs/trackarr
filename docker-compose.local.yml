# =============================================================================
# Local Development/Testing Docker Compose
# =============================================================================
# Simplified setup for local testing - no Caddy, no SSL, no PgBouncer
# Usage: docker compose -f docker-compose.local.yml --env-file .env.local-prod up -d
# =============================================================================

services:
  # =============================================================================
  # APPLICATION - Nuxt Trackarr
  # =============================================================================
  app:
    image: trackarr:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TRACKER_HTTP_URL: ${TRACKER_HTTP_URL:-http://localhost:8080/announce}
        TRACKER_UDP_URL: ${TRACKER_UDP_URL:-udp://localhost:8081/announce}
        TRACKER_WS_URL: ${TRACKER_WS_URL:-ws://localhost:8082}
    container_name: trackarr
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_SERVE_STATIC: "true"
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_SECRET}
      # Served over plain HTTP locally: secure cookies would never be sent back
      NUXT_SESSION_COOKIE_SECURE: "false"
      # Direct connection to PostgreSQL (no PgBouncer for simplicity)
      DATABASE_URL: postgres://${DB_USER:-tracker}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trackarr}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tracker}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-trackarr}
      DB_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRACKER_HTTP_URL: ${TRACKER_HTTP_URL:-http://localhost:8080/announce}
      TRACKER_UDP_URL: ${TRACKER_UDP_URL:-}
      TRACKER_WS_URL: ${TRACKER_WS_URL:-}
      # Runtime override of the URLs baked at build time (issue #49)
      NUXT_PUBLIC_TRACKER_HTTP_URL: ${TRACKER_HTTP_URL:-http://localhost:8080/announce}
      NUXT_PUBLIC_TRACKER_UDP_URL: ${TRACKER_UDP_URL:-}
      NUXT_PUBLIC_TRACKER_WS_URL: ${TRACKER_WS_URL:-}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      # Port 3000 is published directly, without a proxy: never trust
      # X-Forwarded-For / X-Real-IP from LAN or Docker addresses
      TRUSTED_PROXIES: none
      # Tracker service private API (swarm peers, status)
      TRACKER_INTERNAL_URL: http://tracker:8090
      TRACKER_INTERNAL_TOKEN: ${TRACKER_INTERNAL_TOKEN:?TRACKER_INTERNAL_TOKEN is required}
    ports:
      - "3000:3000"   # Web UI
    volumes:
      - uploads_data:/app/public/uploads
      - uploads_data:/app/.output/public/uploads
      - uploads_data:/app/.output/public/uploads
    networks:
      - trackarr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =============================================================================
  # TRACKER - BitTorrent announce/scrape (Rust service, see tracker/)
  # =============================================================================
  tracker:
    image: trackarr-tracker:latest
    build: ./tracker
    container_name: trackarr-tracker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-tracker}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trackarr}
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      TRACKER_INTERNAL_TOKEN: ${TRACKER_INTERNAL_TOKEN:?TRACKER_INTERNAL_TOKEN is required}
      TRACKER_DEBUG: ${TRACKER_DEBUG:-false}
      # Tracker port is published directly (no proxy): ignore X-Forwarded-For
      TRACKER_TRUST_PROXY: "false"
    volumes:
      # Swarms saved on stop, reloaded on start (no credit gap on deploys)
      - tracker_data:/data
    ports:
      - "8080:8080"   # HTTP Tracker
    read_only: true
    networks:
      - trackarr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Time to write pending credit to the database on stop
    stop_grace_period: 30s

  # =============================================================================
  # DATABASE - PostgreSQL
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: trackarr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-trackarr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tracker} -d ${DB_NAME:-trackarr}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trackarr

  # =============================================================================
  # CACHE - Redis
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: trackarr-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trackarr

  # =============================================================================
  # MONITORING - Beszel (host and container metrics, alerts)
  # =============================================================================
  # UI on http://localhost:3001. Pairing: see docker-compose.prod.yml
  beszel:
    image: henrygd/beszel:0.21.0
    container_name: trackarr-beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - trackarr

  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: trackarr-beszel-agent
    # Starts once paired (exits without a key): COMPOSE_PROFILES=monitoring
    profiles: [monitoring]
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      # Container stats; remove to monitor the host only
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY:-}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}

networks:
  trackarr:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  tracker_data:
    driver: local
  redis_data:
    driver: local
  beszel_data:
    driver: local
  beszel_socket:
    driver: local
  beszel_agent_data:
    driver: local
  uploads_data:
    driver: local
